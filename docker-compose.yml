services:
  mysql:
    image: mysql:8.0
    container_name: gestion-projets-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: gestion-projets-backend:latest
    build: ./backend
    container_name: gestion-projets-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8089:8089"
    restart: on-failure

  frontend:
    image: gestion-projets-frontend:latest
    build: ./frontend
    container_name: gestion-projets-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data: